# ---------------------------------------------------------------------------
# Helios — Configuración declarativa del API Gateway (Kong 3.8, modo DB-less)
#
# El gateway es el único punto de entrada al sistema. Responsabilidades:
#   1. Enrutar el contrato público (/v1/**) al microservicio dueño de cada capacidad.
#   2. Autenticar con JWT y validar scopes.
#   3. Limitar la tasa por consumidor.
#   4. Balancear carga sobre las dos instancias de pricing-search con health checks
#      activos, sacando del anillo la instancia que no responde.
#   5. Propagar un identificador de correlación (X-Correlation-Id) hacia los servicios.
#
# IMPORTANTE: este archivo es una PLANTILLA. El marcador __HELIOS_JWT_SECRET__ se
# reemplaza por el valor de la variable de entorno HELIOS_JWT_SECRET en el
# arranque del contenedor (ver el `command` de api-gateway en docker-compose.yml),
# que renderiza /tmp/kong.yml y arranca Kong contra ese archivo.
#
# Se hace así, y no con el vault `env` de Kong, porque Kong no resuelve
# referencias `{vault://...}` en el campo `jwt_secrets.secret`: las guarda como
# texto literal y la validación del token falla. Verificado en Kong 3.8.
#
# Consecuencia: en este repositorio no hay ningún secreto escrito.
# ---------------------------------------------------------------------------

_format_version: '3.0'
_transform: true

# ---------------------------------------------------------------------------
# Consumidores de la capacidad pública
# ---------------------------------------------------------------------------
consumers:
  # Grupo consumidor asignado por la cátedra. El `key` es el claim `iss` del JWT.
  - username: grupo-consumidor
    custom_id: grupo-consumidor-2026
    jwt_secrets:
      - key: grupo-consumidor
        algorithm: HS256
        secret: '__HELIOS_JWT_SECRET__'

  # Consumidor usado por el frontend propio de Helios.
  - username: helios-frontend
    custom_id: helios-frontend-2026
    jwt_secrets:
      - key: helios-frontend
        algorithm: HS256
        secret: '__HELIOS_JWT_SECRET__'

# ---------------------------------------------------------------------------
# Upstream balanceado: dos instancias de pricing-search-service
# ---------------------------------------------------------------------------
upstreams:
  - name: precios-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /salud/viva
        timeout: 2
        concurrency: 2
        healthy:
          interval: 5
          successes: 1
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 2
          timeouts: 2
          http_statuses: [429, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          successes: 1
          http_statuses: [200, 201, 202, 400, 401, 403, 404, 409, 422]
        unhealthy:
          http_failures: 3
          timeouts: 3
          http_statuses: [500, 502, 503, 504]
    targets:
      - target: pricing-search-1:3003
        weight: 100
      - target: pricing-search-2:3003
        weight: 100

# ---------------------------------------------------------------------------
# Servicios y rutas
# ---------------------------------------------------------------------------
services:

  # --- Capacidad pública: catálogo y cotizaciones (pricing-search-service) ---
  - name: precios-publico
    host: precios-upstream
    port: 3003
    protocol: http
    connect_timeout: 2000
    write_timeout: 5000
    read_timeout: 5000
    retries: 2
    routes:
      - name: publico-catalogo
        paths: ['~/v1/proveedor/catalogo$']
        methods: [GET]
        strip_path: false
      - name: publico-cotizaciones
        paths: ['~/v1/proveedor/cotizaciones']
        methods: [GET, POST]
        strip_path: false
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          key_claim_name: iss
      - name: rate-limiting
        config:
          minute: 60
          policy: local
          limit_by: consumer
          fault_tolerant: true
          hide_client_headers: false

  # --- Capacidad pública: disponibilidad y pedidos (stock-service) ---
  - name: pedidos-publico
    host: stock-service
    port: 3004
    protocol: http
    connect_timeout: 2000
    write_timeout: 10000
    read_timeout: 10000
    retries: 0           # una reserva NO se reintenta a ciegas en el gateway
    routes:
      - name: publico-disponibilidad
        paths: ['~/v1/proveedor/disponibilidad$']
        methods: [GET]
        strip_path: false
      - name: publico-pedidos
        paths: ['~/v1/pedidos']
        methods: [GET, POST, DELETE]
        strip_path: false
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          key_claim_name: iss
      - name: rate-limiting
        config:
          minute: 60
          policy: local
          limit_by: consumer
          fault_tolerant: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 1   # MB — una reserva es un cuerpo chico

  # --- API interna del frontend propio: catálogo maestro ---
  - name: catalogo-interno
    host: catalog-service
    port: 3002
    protocol: http
    connect_timeout: 2000
    read_timeout: 5000
    retries: 2
    routes:
      - name: interno-catalogo
        paths: ['/interno/catalogo']
        strip_path: true
        path_handling: v0
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          key_claim_name: iss

  # --- API interna del frontend propio: importaciones ---
  - name: importaciones-interno
    host: import-service
    port: 3001
    protocol: http
    connect_timeout: 2000
    read_timeout: 30000     # subir y parsear una lista de precios tarda
    retries: 0
    routes:
      - name: interno-importaciones
        paths: ['/interno/importaciones']
        strip_path: true
        path_handling: v0
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          key_claim_name: iss
      - name: request-size-limiting
        config:
          allowed_payload_size: 25  # MB — planillas de fabricantes

  # --- API interna del frontend propio: stock y reposición ---
  - name: stock-interno
    host: stock-service
    port: 3004
    protocol: http
    connect_timeout: 2000
    read_timeout: 5000
    retries: 2
    routes:
      - name: interno-stock
        paths: ['/interno/stock']
        strip_path: true
        path_handling: v0
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          key_claim_name: iss

  # --- Mock del contrato, publicado para el grupo consumidor (sin auth) ---
  # Permite que el consumidor se integre contra los ejemplos del contrato antes
  # de que exista la implementación real. Se retira cuando /v1 quede operativo.
  - name: mock-contrato
    host: mock-contrato
    port: 4010
    protocol: http
    connect_timeout: 2000
    read_timeout: 5000
    routes:
      - name: mock-publico
        paths: ['/mock']
        strip_path: true
        path_handling: v0

  # --- Salud de los servicios, sin autenticación (para el balanceador y uptime) ---
  - name: salud-catalogo
    host: catalog-service
    port: 3002
    protocol: http
    routes:
      - name: salud-catalogo
        paths: ['/salud/catalogo']
        strip_path: true
        path_handling: v0
  - name: salud-precios
    host: precios-upstream
    port: 3003
    protocol: http
    routes:
      - name: salud-precios
        paths: ['/salud/precios']
        strip_path: true
        path_handling: v0
  - name: salud-stock
    host: stock-service
    port: 3004
    protocol: http
    routes:
      - name: salud-stock
        paths: ['/salud/stock']
        strip_path: true
        path_handling: v0
  - name: salud-importaciones
    host: import-service
    port: 3001
    protocol: http
    routes:
      - name: salud-importaciones
        paths: ['/salud/importaciones']
        strip_path: true
        path_handling: v0

# ---------------------------------------------------------------------------
# Plugins globales
# ---------------------------------------------------------------------------
plugins:
  # Identificador de correlación para trazar una operación de punta a punta.
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid#counter
      echo_downstream: true

  # Métricas del gateway en formato Prometheus (http://localhost:8100/metrics).
  # Incluye el estado por instancia del upstream balanceado.
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      upstream_health_metrics: true
