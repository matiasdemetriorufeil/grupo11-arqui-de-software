name: helios

# ---------------------------------------------------------------------------
# Helios — Plataforma mayorista de equipamiento solar
# Arquitectura de Software 2026 (UCC) — Entrega 1
#
# Puesta en marcha completa con un solo comando:
#
#     docker compose up --build
#
# Todos los valores de configuración tienen un default local de desarrollo, así
# que no hace falta ningún paso manual previo. Para generar credenciales locales
# propias (recomendado): scripts/bootstrap.sh  (o scripts/bootstrap.ps1)
# ---------------------------------------------------------------------------

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-node-service: &node-service
  restart: unless-stopped
  logging: *logging

x-node-env: &node-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:

  # =========================================================================
  # Punto de entrada único
  # =========================================================================

  api-gateway:
    image: kong:3.8
    container_name: helios-api-gateway
    restart: unless-stopped
    logging: *logging
    # api-gateway/kong.template.yml es una plantilla: el marcador del secreto JWT
    # se reemplaza acá, en el arranque, por el valor de HELIOS_JWT_SECRET. Así no
    # hay ningún secreto escrito en el repositorio. (Kong no resuelve referencias
    # de vault en jwt_secrets.secret, por eso se renderiza en lugar de usarlas.)
    entrypoint: ['/bin/sh', '-c']
    command:
      # Un único argumento para `sh -c`: renderiza la plantilla y arranca Kong.
      - >-
        sed "s#__HELIOS_JWT_SECRET__#$$HELIOS_JWT_SECRET#g"
        /kong/kong.template.yml > /tmp/kong.yml &&
        exec /docker-entrypoint.sh kong docker-start
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-notice}
      # Secreto de firma de los JWT de desarrollo. En la nube se inyecta por
      # variable de entorno del proveedor; nunca se versiona un valor real.
      HELIOS_JWT_SECRET: ${HELIOS_JWT_SECRET:-dev-only-no-usar-en-la-nube}
    volumes:
      - ./api-gateway/kong.template.yml:/kong/kong.template.yml:ro
    ports:
      - '${PUERTO_GATEWAY:-8000}:8000'   # proxy público
      - '8001:8001'                      # admin API (sólo local)
      - '8100:8100'                      # status / métricas del gateway
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      catalog-service:
        condition: service_started
      stock-service:
        condition: service_started
      pricing-search-1:
        condition: service_started
      pricing-search-2:
        condition: service_started
      import-service:
        condition: service_started

  # =========================================================================
  # Mock del contrato público (Entrega 1)
  # Sirve docs/contracts/openapi.yaml con los ejemplos del contrato, para que el
  # grupo consumidor pueda integrarse antes de que exista la implementación real.
  # =========================================================================

  mock-contrato:
    image: stoplight/prism:4
    container_name: helios-mock-contrato
    restart: unless-stopped
    logging: *logging
    command: mock --host 0.0.0.0 --port 4010 --cors /contrato/openapi.yaml
    volumes:
      - ./docs/contracts/openapi.yaml:/contrato/openapi.yaml:ro
    ports:
      - '${PUERTO_MOCK:-4010}:4010'

  # =========================================================================
  # Microservicios
  # =========================================================================

  # Ingesta y normalización de listas de precios de fabricantes.
  # Patrón interno: pipeline por etapas (ingesta → parseo → normalización →
  # validación → publicación). Persistencia: MongoDB (schema-on-read).
  import-service:
    <<: *node-service
    build: ./services/import-service
    container_name: helios-import-service
    environment:
      <<: *node-env
      PUERTO: 3001
      SERVICIO: import-service
      MONGO_URL: mongodb://${MONGO_USUARIO:-helios}:${MONGO_CLAVE:-helios_dev}@mongo-import:27017/helios_importaciones?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:-helios}:${RABBITMQ_CLAVE:-helios_dev}@rabbitmq:5672
      CATALOG_SERVICE_URL: http://catalog-service:3002
    ports:
      - '3001:3001'
    depends_on:
      mongo-import:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Catálogo unificado de productos y mapeo de SKUs por fabricante.
  # Patrón interno: capas (http → aplicación → persistencia).
  # Persistencia: PostgreSQL (integridad referencial estricta).
  catalog-service:
    <<: *node-service
    build: ./services/catalog-service
    container_name: helios-catalog-service
    environment:
      <<: *node-env
      PUERTO: 3002
      SERVICIO: catalog-service
      DATABASE_URL: postgres://${PG_USUARIO:-helios}:${PG_CLAVE:-helios_dev}@postgres-catalog:5432/helios_catalogo
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:-helios}:${RABBITMQ_CLAVE:-helios_dev}@rabbitmq:5672
    ports:
      - '3002:3002'
    depends_on:
      postgres-catalog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Comparador de precios y motor de búsqueda.
  # Patrón interno: CQRS — read model desnormalizado en Elasticsearch alimentado
  # por eventos, con caché cache-aside en Redis.
  # Se despliega en DOS instancias: el gateway balancea el tráfico externo con
  # health checks activos, y el tráfico interno usa el alias de red compartido
  # `precios-interno` (round-robin por DNS de Docker).
  pricing-search-1:
    <<: *node-service
    build: ./services/pricing-search-service
    container_name: helios-pricing-search-1
    environment:
      <<: *node-env
      PUERTO: 3003
      SERVICIO: pricing-search-service
      INSTANCIA: pricing-search-1
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:-helios}:${RABBITMQ_CLAVE:-helios_dev}@rabbitmq:5672
      CATALOG_SERVICE_URL: http://catalog-service:3002
      STOCK_SERVICE_URL: http://stock-service:3004
      RETRASO_MAXIMO_INDICE_SEG: '60'
      # Puebla el índice con productos y precios de demo mientras no exista la
      # cadena de eventos que lo alimenta. Ver src/projection/datos-demo.js.
      CARGAR_DATOS_DEMO: ${CARGAR_DATOS_DEMO:-true}
      TTL_CACHE_BUSQUEDA_SEG: ${TTL_CACHE_BUSQUEDA_SEG:-60}
    networks:
      default:
        aliases: [precios-interno]
    ports:
      - '3003:3003'
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  pricing-search-2:
    <<: *node-service
    build: ./services/pricing-search-service
    container_name: helios-pricing-search-2
    environment:
      <<: *node-env
      PUERTO: 3003
      SERVICIO: pricing-search-service
      INSTANCIA: pricing-search-2
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:-helios}:${RABBITMQ_CLAVE:-helios_dev}@rabbitmq:5672
      CATALOG_SERVICE_URL: http://catalog-service:3002
      STOCK_SERVICE_URL: http://stock-service:3004
      RETRASO_MAXIMO_INDICE_SEG: '60'
      # Puebla el índice con productos y precios de demo mientras no exista la
      # cadena de eventos que lo alimenta. Ver src/projection/datos-demo.js.
      CARGAR_DATOS_DEMO: ${CARGAR_DATOS_DEMO:-true}
      TTL_CACHE_BUSQUEDA_SEG: ${TTL_CACHE_BUSQUEDA_SEG:-60}
    networks:
      default:
        aliases: [precios-interno]
    ports:
      - '3013:3003'
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Inventario, reservas transaccionales y órdenes de reposición.
  # Patrón interno: hexagonal (puertos y adaptadores) + DDD táctico.
  # Persistencia: PostgreSQL (ACID; aquí vive la operación crítica del sistema).
  stock-service:
    <<: *node-service
    build: ./services/stock-service
    container_name: helios-stock-service
    environment:
      <<: *node-env
      PUERTO: 3004
      SERVICIO: stock-service
      DATABASE_URL: postgres://${PG_USUARIO:-helios}:${PG_CLAVE:-helios_dev}@postgres-stock:5432/helios_stock
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:-helios}:${RABBITMQ_CLAVE:-helios_dev}@rabbitmq:5672
      CATALOG_SERVICE_URL: http://catalog-service:3002
      PRICING_SEARCH_URL: http://precios-interno:3003
      # Proveedor externo (capacidad consumida de otro grupo). La URL real se
      # define en la Entrega 2; por ahora apunta al mock para poder ejercitar el
      # camino de integración sin depender de terceros.
      PROVEEDOR_PAGOS_URL: ${PROVEEDOR_PAGOS_URL:-http://mock-contrato:4010}
      TIMEOUT_PROVEEDOR_MS: ${TIMEOUT_PROVEEDOR_MS:-2000}
      MINUTOS_VIGENCIA_RESERVA: ${MINUTOS_VIGENCIA_RESERVA:-15}
    ports:
      - '3004:3004'
    depends_on:
      postgres-stock:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # =========================================================================
  # Persistencia — una base por servicio, sin acceso cruzado
  # =========================================================================

  postgres-catalog:
    image: postgres:16-alpine
    container_name: helios-postgres-catalog
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${PG_USUARIO:-helios}
      POSTGRES_PASSWORD: ${PG_CLAVE:-helios_dev}
      POSTGRES_DB: helios_catalogo
    volumes:
      - datos-postgres-catalog:/var/lib/postgresql/data
      - ./services/catalog-service/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USUARIO:-helios} -d helios_catalogo']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-stock:
    image: postgres:16-alpine
    container_name: helios-postgres-stock
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${PG_USUARIO:-helios}
      POSTGRES_PASSWORD: ${PG_CLAVE:-helios_dev}
      POSTGRES_DB: helios_stock
    volumes:
      - datos-postgres-stock:/var/lib/postgresql/data
      - ./services/stock-service/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USUARIO:-helios} -d helios_stock']
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-import:
    image: mongo:7
    container_name: helios-mongo-import
    restart: unless-stopped
    logging: *logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USUARIO:-helios}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_CLAVE:-helios_dev}
      MONGO_INITDB_DATABASE: helios_importaciones
    volumes:
      - datos-mongo-import:/data/db
      - ./services/import-service/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: helios-elasticsearch
    restart: unless-stopped
    logging: *logging
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.http.ssl.enabled: 'false'
      bootstrap.memory_lock: 'false'
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - datos-elasticsearch:/usr/share/elasticsearch/data
    ports:
      - '9200:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health | grep -q ''"status":"yellow"\|"status":"green"''']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: helios-redis
    restart: unless-stopped
    logging: *logging
    command: redis-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # =========================================================================
  # Mensajería
  # =========================================================================
  # La topología (exchange helios.eventos, colas y DLQ) la declara cada servicio
  # al arrancar, de forma idempotente. Ver docs/adr/ADR-005-comunicacion.md.

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: helios-rabbitmq
    restart: unless-stopped
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USUARIO:-helios}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_CLAVE:-helios_dev}
    volumes:
      - datos-rabbitmq:/var/lib/rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'   # consola de administración
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  datos-postgres-catalog:
  datos-postgres-stock:
  datos-mongo-import:
  datos-elasticsearch:
  datos-rabbitmq:

networks:
  default:
    name: helios
